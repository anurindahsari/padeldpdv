  document.getElementById('b').innerHTML='Membuka...';
  var enc=new TextEncoder();
  crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(S),iterations:IT,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:u8(V)},key,u8(C)); }).then(function(buf){
    try{ sessionStorage.setItem('hpc-wpin',pin); sessionStorage.removeItem('hpc-wfrom'); }catch(x){}
    var html=new TextDecoder().decode(buf); document.open(); document.write(html); document.close();
  }).catch(function(){ document.getElementById('b').innerHTML='Buka'; var fr=null; try{ fr=sessionStorage.getItem('hpc-wfrom'); sessionStorage.removeItem('hpc-wfrom'); }catch(x){} if(!quiet||fr) document.getElementById('e').innerHTML='PIN salah. Coba lagi.'; try{ sessionStorage.removeItem('hpc-wpin'); }catch(x){} });
}
document.getElementById('f').onsubmit=function(ev){ ev.preventDefault(); open_(document.getElementById('pin').value,false); };
try{ var sp=sessionStorage.getItem('hpc-wpin'); if(sp) open_(sp,true); }catch(x){}
</script></body></html>
